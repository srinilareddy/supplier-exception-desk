name: Verify the Supplier Exception Desk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
      - run: uv sync --locked --python 3.13
      - run: npm --prefix frontend ci
      - name: Check the generated API contract
        run: |
          .venv/bin/python -m scripts.export_openapi
          npm --prefix frontend run generate:api
          git diff --exit-code -- openapi.json frontend/src/api-schema.ts
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the full stack
        run: bash scripts/verify_local.sh
